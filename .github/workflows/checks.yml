name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact generated commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Confirm exact checkout
        env:
          EXPECTED_HEAD: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check installer syntax and fixture tests
        env:
          TEST_WITH_HOMEBREW: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          sh -n install.sh
          python3 -m unittest discover -s tests -v
