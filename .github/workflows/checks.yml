name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check installer syntax and fixture tests
        env:
          TEST_WITH_HOMEBREW: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          sh -n install.sh
          python3 -m unittest discover -s tests -v
