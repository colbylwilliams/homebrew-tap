name: Sync public release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: sync-public-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate installer and generator
        run: |
          sh -n install.sh
          python3 -m unittest discover -s tests -v
      - name: Anonymously validate latest and generate pinned metadata
        run: python3 scripts/sync_release.py
      - name: Propose a reviewed release update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -- Formula/co.rb releases/latest.txt
          if git diff --cached --quiet; then
            echo "The tap already matches the public release."
            exit 0
          fi
          version="$(awk '$1 == "version" { print $2 }' releases/latest.txt)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          branch="automation/co-v${version}"
          existing="$(gh pr list --state all --head "$branch" --json number --jq 'length')"
          if [ "$existing" != 0 ]; then
            echo "An update PR already exists for co ${version}; leaving it unchanged."
            exit 0
          fi
          gh auth setup-git
          remote="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ -n "$remote" ]; then
            git fetch origin "refs/heads/$branch"
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$(git write-tree)" ]; then
              echo "::error::Existing update branch differs; inspect it rather than overwriting it."
              exit 1
            fi
          else
            git switch -c "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update co to ${version}"
            git push origin "HEAD:refs/heads/$branch"
          fi
          gh pr create --base main --head "$branch" \
            --title "Update co to ${version}" \
            --body "Pins the formula and installer index to the same anonymously verified GHCR manifest. All four archive digests, SHA256SUMS, immutable version tag, and archive layouts were checked. Review before merging; this workflow never merges. GITHUB_TOKEN-created PRs do not trigger PR workflows automatically; fixture tests ran in the sync job, and Checks can also be dispatched on this branch."
