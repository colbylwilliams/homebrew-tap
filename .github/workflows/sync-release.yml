name: Sync public release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: sync-public-release
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'colbylwilliams/homebrew-tap' &&
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      tree: ${{ steps.prepare.outputs.tree }}
      version: ${{ steps.prepare.outputs.version }}
      pr: ${{ steps.prepare.outputs.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare verified generated update PR
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 scripts/update_release.py prepare

  validate:
    needs: sync
    if: needs.sync.outputs.head != ''
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.sync.outputs.head }}

  publish:
    needs: [sync, validate]
    if: >-
      github.repository == 'colbylwilliams/homebrew-tap' &&
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      needs.sync.outputs.head != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.sync.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish exact validated metadata and record PR merge
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE: ${{ needs.sync.outputs.base }}
          UPDATE_HEAD: ${{ needs.sync.outputs.head }}
          UPDATE_TREE: ${{ needs.sync.outputs.tree }}
          UPDATE_VERSION: ${{ needs.sync.outputs.version }}
          UPDATE_PR: ${{ needs.sync.outputs.pr }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 scripts/update_release.py merge
